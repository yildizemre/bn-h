<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HypeVision · Sunumlar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f2226'/%3E%3Cpath d='M4 18h16M4 15l4-4 4 3 5-7' fill='none' stroke='%23F5B301' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Serif+4:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0f1012;font-family:Manrope,system-ui,sans-serif;color:#1f2226}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(720px 380px at 88% -8%,rgba(245,179,1,.18),transparent 60%),#0f1012}
.wrap{width:min(720px,100%)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:#f3ecdc}
.mk{width:36px;height:36px;border-radius:10px;background:#1f2226;display:grid;place-items:center;border:1px solid #2a2f37}
.wm{font-weight:800;font-size:20px;letter-spacing:-.03em}
.wm b{color:#C8890F}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:32px;line-height:1.15;color:#faf5e8;margin-bottom:8px}
p{color:#a7adb6;font-weight:500;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
a.card{display:block;text-decoration:none;color:#1f2226;background:#faf5e8;border-radius:18px;padding:22px 20px;box-shadow:0 16px 36px -18px rgba(0,0,0,.5)}
a.card .k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#C8890F;margin-bottom:8px}
a.card .t{font-family:"Source Serif 4",Georgia,serif;font-size:22px;font-weight:700;margin-bottom:8px}
a.card .d{font-size:13.5px;color:#5c626b;line-height:1.45}
a.card .go{margin-top:16px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#1f2226;background:#F5B301;padding:9px 12px;border-radius:10px}
@media (max-width:640px){
  h1{font-size:26px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="mk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5B301" stroke-width="2"><path d="M4 20h16"/><path d="M4 16l4-4 4 3 5-7"/></svg></div>
    <div class="wm">Hype<b>Vision</b></div>
  </div>
  <h1>İki ayrı sunum</h1>
  <p>Bankacılık veya perakende kasa fraud. Birini seçin.</p>
  <div class="grid">
    <a class="card" href="banka.html">
      <div class="k">01 · Banka</div>
      <div class="t">Bankacılık</div>
      <div class="d">Şube, ATM, kara liste, kuyruk, nakit ve yönetim paneli.</div>
      <div class="go">Sunumu aç →</div>
    </a>
    <a class="card" href="fraud.html">
      <div class="k">02 · Perakende</div>
      <div class="t">Kasa Fraud</div>
      <div class="d">POS / SAP fişi ile kasa kamerası. İptal, iade, hayali satış.</div>
      <div class="go">Sunumu aç →</div>
    </a>
  </div>
</div>
</body>
</html>
